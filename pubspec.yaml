name: lets_talk
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  go_router: ^17.0.1
  intl: ^0.20.2
  logger: ^2.6.2
  dio: ^5.9.0
  web_socket_channel: ^3.0.1
  country_code_picker: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.12

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env

flutter_intl:
  enabled: true
  class_name: S
  main_locale: ru
  output_dir: lib/common/l10n/generated
  arb_dir: lib/common/l10n/arb