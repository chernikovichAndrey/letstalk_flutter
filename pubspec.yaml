name: lets_talk
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  go_router: ^17.0.1
  intl: ^0.20.2
  logger: ^2.6.2
  dio: ^5.9.0
  web_socket_channel: ^3.0.1
  country_code_picker: ^3.4.1
  phone_numbers_parser: ^9.0.18
  mask_text_input_formatter: ^2.9.0
  shared_preferences: ^2.3.5
  pinput: ^6.0.1
  device_info_plus: ^12.3.0
  uuid: ^4.5.2
  flutter_native_splash: ^2.4.7
  shimmer_animation: ^2.2.2+1
  flutter_webrtc: ^1.2.1
  permission_handler: ^12.0.1
  audioplayers: ^6.5.1
  flutter_contacts: ^1.1.9
  photo_manager: ^3.8.3
  gal: ^2.3.0
  image_picker: ^1.2.1
  file_picker: ^10.3.8
  flutter_staggered_grid_view: ^0.7.0
  camera: ^0.11.3
  path_provider: ^2.1.5
  fluttertoast: ^9.0.0
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.0.19
  crop_your_image: ^2.0.0
  image: ^4.3.0
  cached_network_image: ^3.4.1
  package_info_plus: ^8.1.3
  webview_flutter: ^4.10.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  video_player: ^2.10.1
  flutter_local_notifications: ^20.1.0
  app_badge_plus: ^1.1.2
  wakelock_plus: ^1.3.3
  flutter_video_caching: ^1.1.1
  google_fonts: ^8.0.2
  flutter_callkit_incoming: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.8.12
  build_runner: ^2.10.5
  injectable_generator: ^2.11.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/sounds/
    - assets/images/animals/
    - assets/html/

flutter_intl:
  enabled: true
  class_name: S
  main_locale: ru
  output_dir: lib/common/l10n/generated
  arb_dir: lib/common/l10n/arb